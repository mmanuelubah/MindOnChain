baseURL = "https://mind-on-chain.vercel.app/"
title = "Alltech Solutions"
languageCode = "en-NG"
theme = "hello-friend-ng"
pagination.pagerSize = 10

[params]
  description = "Alltech Solutions is an ECU and immobiliser workshop in Lagos: ECU programming, cloning and virginising, remapping, parts sourced from Ladipo Market, and a free database of the procedures."
  author = "Ubanatu Chinaza Emmanuel"
  location = "Lagos, Nigeria"
  ownerNameDisplay = "Ubanatu Chinaza Emmanuel"
  ownerNameMeaning = "Ubanatu means 'honour/nobility'; Chinaza means 'God answers'; Emmanuel means 'God is with us'."

# Every contact route and external profile lives here; templates read them from this block.
[params.contact]
  whatsapp = "2348039914565"          # international format for wa.me links
  whatsappDisplay = "0803 991 4565"
  email = "ubanatuchinaza@gmail.com"

[params.social]
  linkedin = "https://www.linkedin.com/in/chinaza-ubanatu-05a983184/"
