<!doctype html>
<html lang="{{ site.LanguageCode | default "en-NG" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/site.js" | relURL }}" defer></script>
  {{- if .Params.private }}
  <script src="{{ "js/access-session.js" | relURL }}" defer></script>
  {{- end }}
</body>
</html>
