{{ define "main" }}
<div class="wrap">
  {{ partial "crumbs.html" . }}
  <header class="page-head"><h1 class="h1">{{ .Title }}</h1></header>
  <ul class="brand-grid">
    {{- range .Data.Terms.ByCount }}
    <li><a class="brand-chip" href="{{ .Page.RelPermalink }}">#{{ .Page.Title }} <span>{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
