{{- /* One line in a list of writing. Locked pages show their title only: no summary, so nothing leaks. */ -}}
<li class="post-item">
  <a class="post-item-link" href="{{ .RelPermalink }}">
    <span class="post-item-title">{{ .Title }}{{ if .Params.private }} <span class="lock-badge">Locked</span>{{ end }}</span>
    <span class="post-item-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2 2006" }}</time>
      {{- range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}
    </span>
  </a>
</li>
