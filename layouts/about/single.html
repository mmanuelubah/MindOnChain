{{ define "main" }}
{{ partial "blog-nav.html" . }}
<article class="wrap blog post">
  <header class="blog-profile">
    <img class="blog-avatar" src="{{ "images/avatar-320.webp" | relURL }}" width="160" height="160" alt="Ubanatu Chinaza Emmanuel">
    <div>
      <h1 class="blog-name">{{ site.Params.ownerNameDisplay }}</h1>
      <p class="meta">{{ site.Params.location }}</p>
      {{- with site.Params.ownerNameMeaning }}
      <details class="name-meaning"><summary>What my name means</summary><p>{{ . }}</p></details>
      {{- end }}
    </div>
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
